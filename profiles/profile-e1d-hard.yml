# ┌─────────────────────────────────────────────────────────┐
# │ Experiment 1D — Keycloak + OIDC + WebAuthn (Hardened)   │
# │ Override: mounts hardened WebAuthn Keycloak realm config │
# └─────────────────────────────────────────────────────────┘
services:
  idp:
    volumes:
      - ./configs/keycloak/realm-export-webauthn-hardened.json:/opt/keycloak/data/import/realm-export.json:ro

  app:
    environment:
      AUTH_MODE: oidc
      HARDENED: "true"
      CLIENT_SECRET: "Str0ngCl!entS3cr3t_changeme"
