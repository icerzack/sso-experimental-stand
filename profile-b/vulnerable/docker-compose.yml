services:
  app:
    build:
      context: ../..
      dockerfile: profile-b/vulnerable/app/Dockerfile
    container_name: profile-b-vuln-app
    env_file: .env
    ports:
      - "8082:8080"
    networks:
      - profile-b-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  profile-b-net:
    driver: bridge
