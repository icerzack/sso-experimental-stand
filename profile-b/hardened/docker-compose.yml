services:
  app:
    build:
      context: ../..
      dockerfile: profile-b/hardened/app/Dockerfile
    container_name: profile-b-hard-app
    env_file: .env
    networks:
      - profile-b-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: profile-b-hard-caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - profile-b-net
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  profile-b-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
