          - https://app.sso-lab.local/callback
          - https://app.sso-lab.local/login/callback
          - https://app.sso-lab.local/auth/callback
        grant_types:
          - authorization_code
        response_types:
          - code
        scopes:
          - openid
          - profile
          - email

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 1
      salt_length: 16
      parallelism: 8
      memory: 64

access_control:
  default_policy: deny
  rules:
    - domain: "app.sso-lab.local"
      policy: one_factor

session:
  secret: insecure_session_secret_change_me
  expiration: 3600
  inactivity: 300
  cookies:
    - name: authelia_session
      domain: sso-lab.local
      authelia_url: https://idp.sso-lab.local
  redis:
    host: redis
    port: 6379

regulation:
  max_retries: 0
  find_time: 2m
  ban_time: 5m

notifier:
  filesystem:
    filename: /config/notification.txt
