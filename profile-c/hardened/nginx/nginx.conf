events {
    worker_connections 1024;
}

http {
    # HARDENED A12: security headers on every response
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options              "DENY"                              always;
    add_header X-Content-Type-Options       "nosniff"                           always;
    add_header Content-Security-Policy      "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://app-c-h.local" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"   always;

    server {
        listen 80;
        server_name app-c-h.local;
        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen              443 ssl;
        server_name         app-c-h.local;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # HARDENED: modern TLS only
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass         http://app:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
