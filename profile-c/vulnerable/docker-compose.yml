services:
  app:
    build:
      context: ../..
      dockerfile: profile-c/vulnerable/app/Dockerfile
    container_name: profile-c-vuln-app
    env_file: .env
    ports:
      - "8083:8080"
    networks:
      - profile-c-net
    depends_on:
      vaultwarden:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: profile-c-vuln-vaultwarden
    env_file: .env
    volumes:
      - vw_data:/data
    networks:
      - profile-c-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/alive"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  profile-c-net:
    driver: bridge

volumes:
  vw_data:
