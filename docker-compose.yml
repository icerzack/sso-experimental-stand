services:
  postgres:
    image: postgres:15-alpine
    container_name: sso-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sso-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: sso-keycloak
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KC_HOSTNAME: keycloak.localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HTTP_RELATIVE_PATH: /
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    networks:
      - sso-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 1 cat <&3 | grep -q 'HTTP/1.1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: sso-app
    environment:
      PORT: 8080
      APP_BASE_URL: ${APP_BASE_URL:-http://app.localhost}
      KEYCLOAK_ISSUER_HOST: ${KEYCLOAK_ISSUER_HOST:-keycloak.localhost}
      KEYCLOAK_INTERNAL_HOST: keycloak
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8080}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgres://keycloak:keycloak@postgres:5432/keycloak?sslmode=disable}
      PROFILE_A_REALM: ${PROFILE_A_REALM:-profile-a}
      PROFILE_A_CLIENT_ID: ${PROFILE_A_CLIENT_ID:-sso-test-app}
      PROFILE_A_CLIENT_SECRET: ${PROFILE_A_CLIENT_SECRET:-profile-a-secret}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:-http://localhost:8081,https://localhost:8443}
      WEBAUTHN_USER_ID: ${WEBAUTHN_USER_ID:-passkey-user}
      LOCAL_LOGIN_USERNAME: ${LOCAL_LOGIN_USERNAME:-testuser1}
      LOCAL_LOGIN_PASSWORD: ${LOCAL_LOGIN_PASSWORD:-password123}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    ports:
      - "${APP_HOST_PORT:-8081}:8080"
    networks:
      - sso-network
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: sso-vaultwarden
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:-https://vaultwarden.localhost}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-true}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-dev-admin-token}
    volumes:
      - vaultwarden-data:/data
    ports:
      - "${VAULTWARDEN_PORT:-8083}:80"
    networks:
      - sso-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/alive"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: sso-caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    networks:
      - sso-network
    depends_on:
      - keycloak
      - app
      - vaultwarden

  prometheus:
    image: prom/prometheus:latest
    container_name: sso-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - sso-network
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: sso-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    ports:
      - "3000:3000"
    networks:
      - sso-network
    depends_on:
      - prometheus

networks:
  sso-network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus-data:
  grafana-data:
  vaultwarden-data:

