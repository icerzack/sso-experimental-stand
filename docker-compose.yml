version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sso-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sso-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: sso-keycloak
    command: 
      - start-dev
      - --import-realm
      - --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KC_HOSTNAME: keycloak.localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_PROXY: edge
      KC_PROXY_ADDRESS_FORWARDING: true
      KC_HTTP_RELATIVE_PATH: /
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    networks:
      - sso-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 1 cat <&3 | grep -q 'HTTP/1.1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  saml-sp:
    build:
      context: ./saml-sp
      dockerfile: Dockerfile
    container_name: sso-saml-sp
    environment:
      PORT: ${SAML_SP_PORT:-8080}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sso-test}
      SAML_SP_URL: ${SAML_SP_URL:-http://saml-sp.localhost}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    ports:
      - "${SAML_SP_PORT:-8081}:${SAML_SP_PORT:-8081}"
    networks:
      - sso-network
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # Use the container's actual listen port (8081 by default in this stack).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/public"]
      interval: 10s
      timeout: 5s
      retries: 5

  oidc-rp:
    build:
      context: ./oidc-rp
      dockerfile: Dockerfile
    container_name: sso-oidc-rp
    environment:
      PORT: ${OIDC_RP_PORT:-8080}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sso-test}
      KEYCLOAK_ISSUER_HOST: ${KEYCLOAK_ISSUER_HOST:-keycloak.localhost}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-oidc-rp-client}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change-me}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-http://oidc-rp.localhost/callback}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    ports:
      - "${OIDC_RP_PORT:-8082}:${OIDC_RP_PORT:-8082}"
    networks:
      - sso-network
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/public"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: sso-caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - sso-network
    depends_on:
      - keycloak
      - saml-sp
      - oidc-rp
    # Healthcheck removed: caddy:alpine image does not reliably include wget/curl.

  prometheus:
    image: prom/prometheus:latest
    container_name: sso-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - sso-network
    depends_on:
      - saml-sp
      - oidc-rp

  grafana:
    image: grafana/grafana:latest
    container_name: sso-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    ports:
      - "3000:3000"
    networks:
      - sso-network
    depends_on:
      - prometheus

networks:
  sso-network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus-data:
  grafana-data:

