global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']

  - job_name: 'app'
    static_configs:
      - targets: ['app:8080']
    metrics_path: /metrics

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'keycloak'
    static_configs:
      - targets: ['idp:8080']
    metrics_path: /realms/sso-lab/metrics
    scheme: http
    # Keycloak metrics are only available when the IdP is Keycloak.
    # For other IdPs (Authentik, Zitadel, Authelia) this job will fail to
    # connect, which is expected. Prometheus will mark it as "DOWN" but
    # continue operating normally.
    # If you want to suppress the scrape errors, comment out this job
    # when running e2b/e2c/e2d profiles.

  - job_name: 'authentik'
    static_configs:
      - targets: ['idp:9300']
    metrics_path: /metrics
    scheme: http
    # Only available when IdP is Authentik (e2b profile).
    # The internal metrics port (9300) is separate from the HTTP port (9000).

  - job_name: 'zitadel'
    static_configs:
      - targets: ['idp:8080']
    metrics_path: /debug/metrics
    scheme: http
    # Only available when IdP is Zitadel (e2c profile).

  - job_name: 'authelia'
    static_configs:
      - targets: ['idp:9091']
    metrics_path: /metrics
    scheme: http
    # Only available when Authelia is configured with metrics enabled.
    # Note: requires enabling metrics in Authelia config and exposing the port.
