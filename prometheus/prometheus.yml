global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'app'
    static_configs:
      - targets: ['app:8080']
        labels:
          service: 'app'

  - job_name: 'keycloak'
    static_configs:
      # Keycloak exposes metrics/health on the management interface when enabled.
      # Default management port is 9000 (container-internal).
      - targets: ['keycloak:9000']
        labels:
          service: 'keycloak'

