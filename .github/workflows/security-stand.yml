name: Security Stand CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-run-attacks:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Add required hosts
        run: |
          cat <<'EOF' | sudo tee -a /etc/hosts
          127.0.0.1 app-a-v.local
          127.0.0.1 app-a-h.local
          127.0.0.1 app-b-v.local
          127.0.0.1 app-b-h.local
          127.0.0.1 app-c-v.local
          127.0.0.1 app-c-h.local
          127.0.0.1 keycloak.local
          127.0.0.1 evil-clone.local
          EOF

      - name: Create CI env files
        run: |
          cat > profile-a/vulnerable/.env <<'ENVEOF'
          PORT=8080
          APP_BASE_URL=http://app-a-v.local:8081
          KEYCLOAK_ISSUER_HOST=keycloak.local
          KEYCLOAK_INTERNAL_HOST=keycloak
          KEYCLOAK_PORT=8080
          PROFILE_A_REALM=profile-a-vulnerable
          PROFILE_A_CLIENT_ID=sso-test-app
          PROFILE_A_CLIENT_SECRET=testpass123
          APP_DATABASE_URL=postgres://keycloak:keycloak@postgres:5432/keycloak?sslmode=disable
          SESSION_SECRET=vulnerable-not-secret-at-all
          ENVEOF

          cat > profile-a/hardened/.env <<'ENVEOF'
          PORT=8080
          APP_BASE_URL=https://app-a-h.local
          KEYCLOAK_ISSUER_HOST=keycloak.local
          KEYCLOAK_INTERNAL_HOST=keycloak
          KEYCLOAK_PORT=8080
          PROFILE_A_REALM=profile-a-hardened
          PROFILE_A_CLIENT_ID=sso-test-app
          PROFILE_A_CLIENT_SECRET=Str0ngCl!entS3cr3t_changeme
          APP_DATABASE_URL=postgres://keycloak:keycloak@postgres:5432/keycloak?sslmode=disable
          SESSION_SECRET=hardened-64-char-random-secret-replace-in-production-please-xx
          ENVEOF

          cat > profile-b/vulnerable/.env <<'ENVEOF'
          PORT=8080
          WEBAUTHN_RP_ID=app-b-v.local
          WEBAUTHN_RP_ORIGINS=http://app-b-v.local:8082
          WEBAUTHN_USER_ID=demo-user
          SESSION_SECRET=insecure-key
          ENVEOF

          cat > profile-b/hardened/.env <<'ENVEOF'
          PORT=8080
          WEBAUTHN_RP_ID=app-b-h.local
          WEBAUTHN_RP_ORIGINS=https://app-b-h.local
          WEBAUTHN_USER_ID=demo-user
          SESSION_SECRET=hardened-64-char-random-secret-replace-in-production-please-xx
          ENVEOF

          cat > profile-c/vulnerable/.env <<'ENVEOF'
          DOMAIN=http://app-c-v.local:8083
          SIGNUPS_ALLOWED=true
          LOGIN_RATELIMIT_MAX_BURST=1000
          LOGIN_RATELIMIT_SECONDS=1
          ADMIN_RATELIMIT_MAX_BURST=1000
          ADMIN_RATELIMIT_SECONDS=1
          ADMIN_TOKEN=admin
          SESSION_JWT_EXPIRATION=10080
          WEBSOCKET_ENABLED=true
          LOG_LEVEL=warn
          PROFILE_C_EMAIL=testuser@example.com
          PROFILE_C_PASSWORD=password123
          ENVEOF

          cat > profile-c/hardened/.env <<'ENVEOF'
          DOMAIN=https://app-c-h.local
          SIGNUPS_ALLOWED=false
          LOGIN_RATELIMIT_MAX_BURST=5
          LOGIN_RATELIMIT_SECONDS=60
          ADMIN_RATELIMIT_MAX_BURST=3
          ADMIN_RATELIMIT_SECONDS=60
          ADMIN_TOKEN=Str0ngAdm!nT0ken_changeme
          SESSION_JWT_EXPIRATION=30
          WEBSOCKET_ENABLED=true
          LOG_LEVEL=warn
          PROFILE_C_EMAIL=testuser@example.com
          PROFILE_C_PASSWORD=password123
          ENVEOF

      - name: Build all images
        run: |
          docker compose -f profile-a/vulnerable/docker-compose.yml --project-name profile-a-vuln build
          docker compose -f profile-a/hardened/docker-compose.yml --project-name profile-a-hard build
          docker compose -f profile-b/vulnerable/docker-compose.yml --project-name profile-b-vuln build
          docker compose -f profile-b/hardened/docker-compose.yml --project-name profile-b-hard build
          docker compose -f profile-c/vulnerable/docker-compose.yml --project-name profile-c-vuln build
          docker compose -f profile-c/hardened/docker-compose.yml --project-name profile-c-hard build

      - name: Prepare output folders
        run: mkdir -p results/raw results/processed site

      - name: Run attacks on all 6 profiles sequentially (non-blocking)
        shell: bash
        run: |
          set +e
          bash profile-c/hardened/nginx/gen-certs.sh || true

          run_variant() {
            local variant="$1"
            echo "=== Running variant: $variant ==="
            case "$variant" in
              a-vuln)
                make up-a-vuln || true
                sleep 10
                make attack-a KC_A=http://keycloak.local:8080 APP_A=http://app-a-v.local:8081 KC_REALM=profile-a-vulnerable KC_CLIENT_SECRET=testpass123 | tee "results/raw/${variant}.txt" || true
                make down-a || true
                ;;
              a-hard)
                make up-a-hard || true
                sleep 10
                make attack-a KC_A=http://keycloak.local:8080 APP_A=https://app-a-h.local APP_A_ALLOWED=app-a-h.local KC_REALM=profile-a-hardened KC_CLIENT_SECRET='Str0ngCl!entS3cr3t_changeme' | tee "results/raw/${variant}.txt" || true
                make down-a || true
                ;;
              b-vuln)
                make up-b-vuln || true
                sleep 5
                make attack-b APP_B=http://app-b-v.local:8082 | tee "results/raw/${variant}.txt" || true
                make down-b || true
                ;;
              b-hard)
                make up-b-hard || true
                sleep 5
                make attack-b APP_B=https://app-b-h.local | tee "results/raw/${variant}.txt" || true
                make down-b || true
                ;;
              c-vuln)
                make up-c-vuln || true
                sleep 5
                make attack-c APP_C=http://app-c-v.local:8083 | tee "results/raw/${variant}.txt" || true
                make down-c || true
                ;;
              c-hard)
                make up-c-hard || true
                sleep 5
                make attack-c APP_C=https://app-c-h.local | tee "results/raw/${variant}.txt" || true
                make down-c || true
                ;;
              *)
                echo "Unknown variant: $variant" >&2
                ;;
            esac
          }

          run_variant a-vuln
          run_variant a-hard
          run_variant b-vuln
          run_variant b-hard
          run_variant c-vuln
          run_variant c-hard
          echo "Attack stage is non-blocking by design."
          exit 0

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E on hardened profiles
        shell: bash
        run: |
          set +e
          make down || true
          bash profile-c/hardened/nginx/gen-certs.sh
          rm -f results/playwright/profile-metrics.json

          make up-a-hard || true
          PROFILE_A_URL=https://app-a-h.local npx playwright test tests/e2e/auth-profiles.spec.js --grep "Profile A" || true
          make down-a || true

          make up-b-hard || true
          PROFILE_B_URL=https://app-b-h.local npx playwright test tests/e2e/auth-profiles.spec.js --grep "Profile B" || true
          make down-b || true

          make up-c-hard || true
          PROFILE_C_URL=https://app-c-h.local npx playwright test tests/e2e/auth-profiles.spec.js --grep "Profile C" || true
          make down-c || true

          echo "Playwright stage is non-blocking by design."
          exit 0

      - name: Generate report site
        run: python3 scripts/generate_site.py

      - name: Build report artifacts
        run: python3 scripts/generate_attack_report.py

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-stand-results
          path: |
            results/raw/**
            results/processed/**
            results/playwright/**

      - name: Upload Playwright raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raw-results
          path: |
            results/playwright/**

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Always cleanup
        if: always()
        run: make down || true
