protocols: [saml, oidc]
scenarios: [cold, warm_idp, session_reuse, logout_relogin]
# Extended dataset profile (aim: ~2-3 hours total):
# - 4 load points: low / medium / high / very high
concurrency: [1, 25, 100, 200]

# Durations per run (increased steady_state_s for more stable measurements)
warm_up_s: 5
steady_state_s: 20

# Repeats per matrix point (increased for statistical significance)
repeats: 5

# Randomization seed for shuffling the run order
seed: 12345

# Endpoints
keycloak_url: http://keycloak.localhost
saml_sp_base_url: http://saml-sp.localhost
oidc_rp_base_url: http://oidc-rp.localhost

# Observability
prometheus_url: http://localhost:9090
prometheus_step: 5s

# Credentials (defaults match README)
username: testuser1
password: password123


